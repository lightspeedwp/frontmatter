model: claude-opus-5-5
temperature: 0
max_tokens: 3000

inputs:
  prompt: "Review and fix this agent frontmatter that has multiple validation errors:\n\n```yaml\n---\nfile_type: agent\nname: \"Database Migration Agent\"\ndescription = \"Handles database schema migrations and rollbacks\"\nversion: version-1.0\ncreated_date: \"01/15/2025\"\nlast_updated: \"10/30/2025\"\nauthor: \"Database Team\"\nowners: database-team\nstatus: ACTIVE\nstability: \"Stable\"\ntags: [database, migrations, automation, schema, sql, performance, optimization, testing, safety]\ndomain: wp-core\ntools:\n  - read\n  - \"grep\"\n  - edit\nmode: agent\ntemperature: 0.7\n---\n```\n\nIdentify all validation errors according to LightSpeed unified schema and provide:\n\n1. **Comprehensive error list**: Every error with line number, field name, and explanation\n2. **Why each breaks the schema**: Reference the specific validation rule\n3. **Corrected version**: Complete, properly formatted frontmatter\n4. **Validation rules applied**: Summary of rules that were broken\n\nConsider and check:\n- Date format validation (ISO 8601 - YYYY-MM-DD required)\n- Version format consistency (semantic versioning or simple version string)\n- Status and stability enum values (must be lowercase)\n- Array vs string field types (owners should be array, not string)\n- Tag count limits (max 8 tags - this has 9)\n- YAML syntax correctness (= instead of :, quoted strings where not needed)\n- Field capitalization and naming (ACTIVE vs active)\n\nThe output should be a detailed error report followed by the complete corrected frontmatter that would pass `validate-agent-frontmatter.js` validation."

criteria:
  - |
    Error count: Must identify at least 10 distinct errors
  - |
    YAML syntax error: Must identify line with "description =" as a YAML syntax error (should use :)
  - |
    Date format errors: Must identify created_date and last_updated as invalid (MM/DD/YYYY not ISO 8601)
  - |
    Version format error: Must identify "version-1.0" as invalid (should be v1.0 or 1.0.0)
  - |
    Status case error: Must identify "ACTIVE" as invalid (should be lowercase "active")
  - |
    Stability case error: Must identify "Stable" as invalid (should be lowercase "stable")
  - |
    Owners type error: Must identify owners as string instead of array (should be list with @handle)
  - |
    Tag count error: Must identify 9 tags as exceeding max of 8
  - |
    Domain value error: Must identify wp-core as inappropriate domain (should be awesome-copilot for agent)
  - |
    Temperature field warning: Must note temperature field is agent-specific and unusual
  - |
    Corrected frontmatter: Must provide complete, valid YAML frontmatter
  - |
    Corrected dates: All dates must be ISO 8601 format (YYYY-MM-DD)
  - |
    Corrected version: Must use semantic versioning format
  - |
    Corrected enum values: All enum fields (status, stability, domain) must be lowercase
  - |
    Corrected owners: Must be an array with valid GitHub handles (e.g., - @handle)
  - |
    Corrected tags: Must have exactly 8 or fewer tags in kebab-case
  - |
    Validation passes: Corrected frontmatter should pass validate-agent-frontmatter.js

expected_output: |
  ## Validation Error Report

  Found 11 errors in the provided frontmatter:

  1. **Line 3: YAML Syntax Error** - `description = "..."` uses `=` instead of `:`
     - YAML requires colons for key-value pairs

  2. **Line 4: Invalid Version Format** - `version: version-1.0` is not semantic versioning
     - Must use v1.0, 1.0.0, or similar format (not "version-X.X")

  3. **Line 5: Invalid Date Format** - `created_date: "01/15/2025"` is not ISO 8601
     - Must use YYYY-MM-DD format (e.g., 2025-01-15)

  4. **Line 6: Invalid Date Format** - `last_updated: "10/30/2025"` is not ISO 8601
     - Must use YYYY-MM-DD format (e.g., 2025-10-30)

  5. **Line 8: Invalid Owners Type** - `owners: database-team` is a string, not an array
     - Must be an array of GitHub handles: `owners: [@handle1, @handle2]`

  6. **Line 9: Invalid Enum Value** - `status: ACTIVE` is uppercase, not lowercase
     - Valid values: active, deprecated, draft, experimental (lowercase only)

  7. **Line 10: Invalid Enum Value** - `stability: "Stable"` has wrong capitalization
     - Valid values: stable, experimental, incubating (lowercase only)

  8. **Line 11: Exceeds Tag Limit** - 9 tags provided but maximum is 8
     - Remove one tag: [database, migrations, automation, schema, sql, performance, optimization, testing]

  9. **Line 12: Invalid Domain Value** - `domain: wp-core` is not appropriate for an agent
     - Should use: awesome-copilot, lightspeed, generic, or other valid domain

  10. **Line 18: Unusual Temperature Field** - `temperature: 0.7` is typically set in agent config, not metadata
     - Consider removing or placing in agent configuration

  11. **Overall: Missing Recommended Fields** - Consider adding: created_date if not present
     - Add both created_date and last_updated for full compliance

  ## Corrected Frontmatter

  ```yaml
  ---
  file_type: agent
  name: Database Migration Agent
  description: Handles database schema migrations and rollbacks
  version: v1.0
  created_date: 2025-01-15
  last_updated: 2026-10-30
  author: Database Team
  owners:
    - @database-team-lead
  status: active
  stability: stable
  tags: [database, migrations, automation, schema, sql, performance, optimization]
  domain: awesome-copilot
  mode: agent
  tools:
    - read
    - grep
    - edit
  ---
  ```

  This corrected version passes all validation rules and is ready to use.
